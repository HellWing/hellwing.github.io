project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
  resources:
    - assets/**

website:
  title: "Wojciech A. Hellwing"
  site-url: "https://hellwing.github.io/"
  description: "Cosmologist, CFT PAN. Cosmic Web, peculiar velocities, beyond-ΛCDM."
  repo-url: https://github.com/HellWing/hellwing.github.io
  repo-actions: [edit, issue]
  favicon: assets/favicon.png
  navbar:
    pinned: true
    background: white
    foreground: "#172B3B"
    left:
      - text: Research
        href: index.qmd#research
      - text: Projects
        href: index.qmd#projects
      - text: Publications
        href: publications.qmd
      - text: People
        href: index.qmd#people
      - text: Profile
        href: index.qmd#profile
      - text: Outreach
        href: index.qmd#outreach
      - text: More
        menu:
          - text: Software
            href: software.qmd
          - text: Data
            href: data.qmd
          - text: Teaching
            href: teaching.qmd
          - text: Supervision
            href: supervision.qmd
          - text: News
            href: news.qmd
          - text: Contact
            href: contact.qmd
    right:
      - text: CV
        href: cv.qmd
  page-footer:
    left: |
      **Wojciech A. Hellwing**\
      {{< var affiliation >}}\
      {{< var location >}}
    right: |
      [Contact](/contact.html) · [About](/about.html) · [Source repository](https://github.com/HellWing/hellwing.github.io)

format:
  html:
    theme: [cosmo, theme.scss]
    html-math-method: mathml
    css: styles.css
    toc: true
    smooth-scroll: true
    code-link: false
    anchor-sections: true
    sanitize: false
